<!doctype html>
<meta charset="utf-8">
<title>Compact visualization development preview</title>
<link rel="stylesheet" href="/components/filter-header.css">
<link rel="stylesheet" href="/components/hotspot-picker.css">
<link rel="stylesheet" href="/visualizations/t1/county-choropleth.css">
<link rel="stylesheet" href="/visualizations/t1/county-richness-bar.css">
<link rel="stylesheet" href="/visualizations/t2/observation-trends.css">
<link rel="stylesheet" href="/visualizations/t2/seasonal-species-heatmap.css">
<link rel="stylesheet" href="/visualizations/t3/holiday-observation-patterns.css">
<link rel="stylesheet" href="/visualizations/t4/hotspot-common.css">
<link rel="stylesheet" href="/visualizations/t4/location-combinations.css">
<link rel="stylesheet" href="/visualizations/t4/hotspot-species-overlap.css">
<link rel="stylesheet" href="/components/visualization-frame.css">
<style>
html,body { margin:0; height:100%; overflow:hidden; }
body { padding:16px; box-sizing:border-box; background:#f3f7fb; font:14px system-ui,sans-serif; }
.preview-toolbar { display:flex; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:8px; }
.preview-toolbar input { width:70px; }
.preview-toolbar select,.preview-toolbar input,.preview-toolbar button { min-height:30px; font:inherit; }
#preview-filters { margin-bottom:12px; }
#preview-card { max-width:100%; max-height:calc(100dvh - 150px); }
#preview-status { margin:8px 0; font-size:12px; }
</style>
<div class="preview-toolbar">
  <strong>Development preview · one compact view at a time</strong>
  <label>Compact visualization <select id="preview-case"></select></label>
  <label>Width <input id="preview-width" type="number" min="500" max="1600"></label>
  <label>Height <input id="preview-height" type="number" min="220" max="700"></label>
  <button id="preview-resize" type="button">Resize panel</button>
</div>
<div id="preview-filters"></div>
<div id="preview-card"></div>
<p id="preview-status" role="status">Loading development preview…</p>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
<script type="module" src="/compact-preview.js"></script>
